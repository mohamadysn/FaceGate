[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facegate"
version = "0.1.0"
description = "FaceGate — cross-platform desktop face recognition with optional eye / gaze tracking"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Mohamad Yassine", email = "mohamadysn@users.noreply.github.com" },
]
keywords = ["face-recognition", "insightface", "opencv", "biometrics", "desktop"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "opencv-python>=4.8",
  "numpy>=1.24",
  "Pillow>=10.0",
  "insightface>=0.7.3",
  "onnxruntime>=1.16",
]

[project.optional-dependencies]
train = [
  "torch>=2.2",
  "torchvision>=0.17",
  "tqdm>=4.66",
  "scikit-learn>=1.3",
]
build = [
  "pyinstaller>=6.0",
]
dev = [
  "opencv-python-headless>=4.8",
]

[project.urls]
Homepage = "https://github.com/mohamadysn/FaceGate"
Documentation = "https://mohamadysn.github.io/FaceGate/"
Repository = "https://github.com/mohamadysn/FaceGate"
Issues = "https://github.com/mohamadysn/FaceGate/issues"

[project.scripts]
facegate = "app.launch:main"

[tool.setuptools.packages.find]
where = ["eye-tracking"]
include = ["common*", "app*"]

[tool.setuptools.package-data]
"app.desktop" = ["assets/*.png"]
